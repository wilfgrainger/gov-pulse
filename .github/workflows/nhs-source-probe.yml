name: NHS Source Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/nhs-source-probe.yml"
      - "worker/live-nhs-publication-collector.js"
      - "worker/live-nhs-collector.js"
      - "worker/nhs-press-notice.js"
      - "worker/nhs-rtt-source-discovery.js"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run exact production NHS collector against current publication
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { collectNhsRttPublication } from "./worker/live-nhs-publication-collector.js";
          import { extractPdfText } from "./worker/live-polling-collector.js";
          import {
            fetchResponse,
            MAX_RESPONSE_BYTES,
            readResponseArrayBuffer,
            readResponseText,
          } from "./worker/live-feed-common.js";
          import {
            NHS_RTT_LANDING_PAGE,
            discoverNhsRttDataPage,
            discoverNhsRttPublicationLinks,
          } from "./worker/nhs-rtt-source-discovery.js";

          async function thresholdContext() {
            const landingResponse = await fetchResponse(NHS_RTT_LANDING_PAGE, fetch);
            const dataPageUrl = discoverNhsRttDataPage(
              await readResponseText(landingResponse, { label: "NHS RTT landing page" }),
              NHS_RTT_LANDING_PAGE
            );
            const dataPageResponse = await fetchResponse(dataPageUrl, fetch);
            const links = discoverNhsRttPublicationLinks(
              await readResponseText(dataPageResponse, { label: "NHS RTT data page" }),
              dataPageUrl
            );
            const pressResponse = await fetchResponse(links.pressNoticeUrl, fetch, "application/pdf");
            const text = await extractPdfText(
              await readResponseArrayBuffer(pressResponse, {
                limit: MAX_RESPONSE_BYTES.pdf,
                label: "NHS RTT PDF",
              })
            );
            const marker = Math.max(text.search(/52\s+weeks/i), text.search(/65\s+weeks/i));
            const start = Math.max(0, marker - 700);
            const end = marker < 0 ? Math.min(text.length, 2000) : Math.min(text.length, marker + 1800);
            console.log("NHS_THRESHOLD_CONTEXT_START");
            console.log(text.slice(start, end));
            console.log("NHS_THRESHOLD_CONTEXT_END");
          }

          try {
            const data = await collectNhsRttPublication(fetch, new Date());
            console.log(JSON.stringify({
              status: "ok",
              headline: data.headline,
              source: data.source,
              historyPoints: data.history?.length ?? 0,
              specialties: data.specialties?.length ?? 0,
            }, null, 2));
          } catch (error) {
            console.error("NHS_SOURCE_PROBE_FAILURE", error instanceof Error ? error.stack : String(error));
            await thresholdContext();
            process.exit(1);
          }
          NODE
