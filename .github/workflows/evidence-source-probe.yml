name: Evidence Source Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/evidence-source-probe.yml"
      - "worker/economy-evidence.js"
      - "worker/migration.js"
      - "worker/official-source-fetch.js"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run current official-source collectors
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { buildGdpTracker } from "./worker/economy-evidence.js";
          import { buildMigrationStats } from "./worker/migration.js";

          const collectors = [
            ["GDP", buildGdpTracker],
            ["migration", buildMigrationStats],
          ];
          let failed = false;
          for (const [name, collect] of collectors) {
            try {
              const result = await collect(fetch);
              console.log(`${name}_SOURCE_PROBE_OK`, JSON.stringify({
                headline: result.headline,
                historyPoints: Array.isArray(result.history) ? result.history.length : 0,
                source: result.source,
              }, null, 2));
            } catch (error) {
              failed = true;
              console.error(`${name}_SOURCE_PROBE_FAILURE`, error instanceof Error ? error.stack : String(error));
            }
          }
          if (failed) process.exit(1);
          NODE
