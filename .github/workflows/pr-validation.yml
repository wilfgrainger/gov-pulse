name: Pull Request Validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce UTF-8 and LF
        run: node scripts/check-text-policy.mjs --changed

      - name: Reject lockfile-only rewrites
        run: node scripts/check-lockfile-policy.mjs

      - name: Enforce Cloudflare architecture
        run: node scripts/check-static-architecture.mjs

      - name: Validate source-repair evidence
        run: node scripts/check-source-repair-backlog.mjs

      - name: Validate source ownership
        run: node scripts/check-source-ownership.mjs

      - name: Enforce focused change complexity
        run: node scripts/check-change-complexity.mjs

      - name: Validate PR description
        run: node scripts/check-pr-description.mjs

      - name: Select validation lane
        id: lane
        run: node scripts/classify-pr-validation.mjs

  docs:
    needs: classify
    if: needs.classify.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm documentation guards passed
        run: echo "Documentation validation passed without dependency installation."

  full-quality:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify toolchain
        run: npm run toolchain:check

      - name: Lint
        run: npm run lint

      - name: Unit and Worker tests
        run: npm run test

      - name: Static Pages seed build
        run: npm run build:check
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Install locked OpenNext toolchain
        run: npm ci --prefix worker --prefer-offline --no-audit --no-fund

      - name: Stage OpenNext adapter config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@opennextjs
          ln -s "$PWD/worker/node_modules/@opennextjs/cloudflare" node_modules/@opennextjs/cloudflare
          cp worker/open-next.config.template open-next.config.ts

      - name: Build request-time Cloudflare web Worker
        run: >-
          ./worker/node_modules/.bin/opennextjs-cloudflare build
          --config worker/web-wrangler.toml
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Verify preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version

      - name: Inspect live production evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = 'https://public-data.org';
          for (const path of ['/data/health.json', '/data/metrics-snapshot.json', '/data/international-comparison.json']) {
            const response = await fetch(`${base}${path}`, { headers: { accept: 'application/json' } });
            const text = await response.text();
            console.log(`LIVE ${path} STATUS ${response.status}`);
            try {
              const json = JSON.parse(text);
              if (path.endsWith('health.json')) console.log(JSON.stringify(json, null, 2));
              else if (path.endsWith('metrics-snapshot.json')) console.log(JSON.stringify({ meta: json.meta, sections: Object.keys(json).filter((key) => key !== 'meta') }, null, 2));
              else {
                const uk = json.countries?.find?.((country) => country.code === 'GBR' || country.id === 'GBR' || country.name === 'United Kingdom');
                console.log(JSON.stringify({ meta: json.meta, uk, metricIds: json.metrics?.map?.((metric) => metric.id) }, null, 2));
              }
            } catch {
              console.log(text.slice(0, 1200));
            }
          }
          NODE

      - name: Run deterministic browser tests against live production
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "https://public-data.org"
        run: npm run test:e2e

      - name: Print live UK in context scorecard
        env:
          CI: "true"
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const response = await page.goto('https://public-data.org/section/uk-in-context', { waitUntil: 'networkidle', timeout: 60000 });
          console.log(`UK_CONTEXT_STATUS=${response?.status()}`);
          console.log(`UK_CONTEXT_TITLE=${await page.title()}`);
          console.log(`UK_CONTEXT_H1=${JSON.stringify(await page.locator('h1').allTextContents())}`);
          console.log('UK_CONTEXT_ROWS');
          for (const row of await page.locator('table tbody tr').allTextContents()) console.log(row.replace(/\s+/g, ' ').trim());
          console.log('UK_CONTEXT_TEXT_PREFIX');
          console.log((await page.locator('main').innerText()).replace(/\s+/g, ' ').slice(0, 7000));
          await browser.close();
          NODE

  quality:
    if: always()
    needs: [classify, docs, full-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm selected validation lane passed
        env:
          LANE: ${{ needs.classify.outputs.lane }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          FULL_QUALITY_RESULT: ${{ needs.full-quality.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = "success"
          if [ "$LANE" = "docs" ]; then
            test "$DOCS_RESULT" = "success"
          elif [ "$LANE" = "full" ]; then
            test "$FULL_QUALITY_RESULT" = "success"
          else
            echo "Unknown validation lane: $LANE"
            exit 1
          fi
