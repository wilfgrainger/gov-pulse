name: Pull Request Validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Checkout (shallow — diff against base only)
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Ensure base ref is available for diffing
        run: git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"

      - name: Select validation lane
        id: lane
        run: node scripts/classify-pr-validation.mjs

  docs:
    needs: classify
    if: needs.classify.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report documentation-only change
        run: echo "Documentation-only changes do not need application dependency installation."

  full-quality:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Ensure base ref is available for diffing
        run: git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"

      - name: Validate public data route boundaries
        run: node scripts/check-static-architecture.mjs

      - name: Validate source ownership
        run: node scripts/check-source-ownership.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify toolchain
        run: npm run toolchain:check

      - name: Prepare generated data and assets
        run: npm run build:prepare

      - name: Install locked OpenNext toolchain
        run: npm ci --prefix worker --prefer-offline --no-audit --no-fund

      - name: Stage OpenNext adapter config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@opennextjs
          ln -s "$PWD/worker/node_modules/@opennextjs/cloudflare" node_modules/@opennextjs/cloudflare
          cp worker/open-next.config.template open-next.config.ts

      - name: Lint, test and build in parallel
        shell: bash
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          log_dir="$(mktemp -d)"

          npm run lint >"$log_dir/lint.log" 2>&1 &
          lint_pid=$!
          npm run test >"$log_dir/test.log" 2>&1 &
          test_pid=$!
          ./worker/node_modules/.bin/opennextjs-cloudflare build --config worker/web-wrangler.toml >"$log_dir/build.log" 2>&1 &
          build_pid=$!

          wait "$lint_pid"
          lint_status=$?
          wait "$test_pid"
          test_status=$?
          wait "$build_pid"
          build_status=$?

          for check in lint test build; do
            echo "::group::$check output"
            cat "$log_dir/$check.log"
            echo "::endgroup::"
          done

          if [ "$lint_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            echo "One or more quality checks failed (lint=$lint_status, test=$test_status, build=$build_status)."
            exit 1
          fi

  quality:
    if: always()
    needs: [classify, docs, full-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm selected validation lane passed
        env:
          LANE: ${{ needs.classify.outputs.lane }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          FULL_QUALITY_RESULT: ${{ needs.full-quality.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = "success"
          if [ "$LANE" = "docs" ]; then
            test "$DOCS_RESULT" = "success"
          elif [ "$LANE" = "full" ]; then
            test "$FULL_QUALITY_RESULT" = "success"
          else
            echo "Unknown validation lane: $LANE"
            exit 1
          fi
