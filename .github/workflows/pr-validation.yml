name: Pull Request Validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Checkout (shallow — diff against base only)
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Ensure base ref is available for diffing
        run: git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"

      # Cheap, universal guards that apply to every PR regardless of lane.
      - name: Enforce UTF-8 and LF on changed files
        run: node scripts/check-text-policy.mjs --changed

      - name: Validate PR description
        run: node scripts/check-pr-description.mjs

      - name: Select validation lane
        id: lane
        run: node scripts/classify-pr-validation.mjs

  docs:
    needs: classify
    if: needs.classify.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm documentation guards passed
        run: echo "Documentation validation passed without dependency installation."

  full-quality:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Ensure base ref is available for diffing
        run: git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"

      # Code-integrity gatekeepers only run when code actually changed. On a
      # docs-only PR these are skipped entirely with the rest of this lane.
      - name: Reject lockfile-only rewrites
        run: node scripts/check-lockfile-policy.mjs

      - name: Enforce Cloudflare architecture
        run: node scripts/check-static-architecture.mjs

      - name: Validate source-repair evidence
        run: node scripts/check-source-repair-backlog.mjs

      - name: Validate source ownership
        run: node scripts/check-source-ownership.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify toolchain
        run: npm run toolchain:check

      - name: Lint
        run: npm run lint

      - name: Unit and Worker tests
        run: npm run test

      - name: Prepare generated data and assets
        run: npm run build:prepare

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

  lighthouse:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking on first introduction: there is no historical score
    # baseline yet, so a hard-fail here could block unrelated PRs. This job
    # is also deliberately excluded from `quality`'s required-results check
    # below, so a failure here can never fail the PR. Tighten both once a
    # few weeks of readings exist.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prepare generated data and assets
        run: npm run build:prepare

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Run Lighthouse CI against a local build+serve preview
        # No deployed PR preview URL exists in this repo's pipeline (Cloudflare
        # deploy runs only on main — see .github/workflows/deploy.yml), so this
        # checks the production `next build` output served locally instead.
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14

  quality:
    if: always()
    needs: [classify, docs, full-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm selected validation lane passed
        env:
          LANE: ${{ needs.classify.outputs.lane }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          FULL_QUALITY_RESULT: ${{ needs.full-quality.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = "success"
          if [ "$LANE" = "docs" ]; then
            test "$DOCS_RESULT" = "success"
          elif [ "$LANE" = "full" ]; then
            test "$FULL_QUALITY_RESULT" = "success"
          else
            echo "Unknown validation lane: $LANE"
            exit 1
          fi
