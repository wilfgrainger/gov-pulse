name: Deploy public-data.org

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - ".nvmrc"
      - "app/**"
      - "contracts/**"
      - "config/**"
      - "data/**"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.*"
      - "public/**"
      - "scripts/**"
      - "worker/**"
  workflow_dispatch:
    inputs:
      refresh_evidence:
        description: "Force national publication and country-comparison refresh (up to ~9 minutes)"
        type: boolean
        default: false
      refresh_contracts:
        description: "Also refresh the bounded Find a Tender contracts edition (requires refresh_evidence)"
        type: boolean
        default: false
      refresh_pages_seed:
        description: "Rebuild and publish the secondary Pages fallback"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-data-production
  cancel-in-progress: false

jobs:
  release_gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Confirm this release is still the current main commit
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_sha" != "$RELEASE_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipped this stale release; the current main revision will deploy in its own serialized run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

  deploy_web_worker:
    needs: release_gate
    if: needs.release_gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publications_paused: ${{ steps.publication_controls.outputs.paused }}
    environment:
      name: cloudflare-web-worker
      url: https://public-data.org/
    steps:
      - name: Checkout source without a persistent GitHub credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install locked dependencies without Cloudflare credentials
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install locked OpenNext toolchain without Cloudflare credentials
        run: npm ci --prefix worker --prefer-offline --no-audit --no-fund

      - name: Validate manually dispatched release source
        if: github.event_name == 'workflow_dispatch'
        run: npm run lint && npm run test

      - name: Prepare generated data and assets
        run: npm run build:prepare
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Stage OpenNext adapter config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@opennextjs
          rm -rf node_modules/@opennextjs/cloudflare
          ln -s "$PWD/worker/node_modules/@opennextjs/cloudflare" node_modules/@opennextjs/cloudflare
          cp worker/open-next.config.template open-next.config.ts

      - name: Adapt Next.js build for Cloudflare Workers
        run: >-
          ./worker/node_modules/.bin/opennextjs-cloudflare build
          --config worker/web-wrangler.toml
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Deploy and verify the exact web Worker revision with its isolated credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ./worker/node_modules/.bin/opennextjs-cloudflare deploy \
            --config worker/web-wrangler.toml \
            --tag "$GITHUB_SHA" \
            --message "public-data.org web Worker $GITHUB_SHA"
          npx wrangler deployments status \
            --json \
            --config worker/web-wrangler.toml \
            > "$RUNNER_TEMP/web-worker-deployments.json"
          node scripts/verify-worker-deployment.mjs "$GITHUB_SHA" \
            < "$RUNNER_TEMP/web-worker-deployments.json"

      - name: Check publication controls
        id: publication_controls
        run: node --input-type=module -e 'import {anyPublicationEnabled} from "./contracts/publication-policy.js"; console.log(`paused=${!anyPublicationEnabled()}`)' >> "$GITHUB_OUTPUT"

  deploy_data_worker:
    needs: release_gate
    if: needs.release_gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-data-worker
      url: https://public-data.org/data/health.json
    steps:
      - name: Checkout source without a persistent GitHub credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install locked dependencies without Cloudflare credentials
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install locked OpenNext toolchain without Cloudflare credentials
        run: npm ci --prefix worker --prefer-offline --no-audit --no-fund

      - name: Validate manually dispatched release source
        if: github.event_name == 'workflow_dispatch'
        run: npm run lint && npm run test

      - name: Prepare generated data and assets
        run: npm run build:prepare
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Deploy and verify the exact data Worker revision with its isolated credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm run worker:deploy -- \
            --tag "$GITHUB_SHA" \
            --message "public-data.org Worker $GITHUB_SHA"
          npx wrangler deployments status \
            --json \
            --config worker/wrangler.toml \
            > "$RUNNER_TEMP/data-worker-deployments.json"
          node scripts/verify-worker-deployment.mjs "$GITHUB_SHA" \
            < "$RUNNER_TEMP/data-worker-deployments.json"

  verify_production:
    if: github.ref == 'refs/heads/main'
    needs: [deploy_web_worker, deploy_data_worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-smoke
      url: https://public-data.org/
    steps:
      - name: Checkout source without a persistent GitHub credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies without Cloudflare credentials
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify deployed revision and reader routes
        run: npm run test:release -- "https://public-data.org/" "${{ github.sha }}"

  recover_evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_evidence && needs.release_gate.outputs.current == 'true'
    needs: [release_gate, deploy_web_worker, deploy_data_worker, verify_production]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    environment:
      name: cloudflare-publication-recovery
      url: https://public-data.org/data/health.json
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Bootstrap national evidence and force the independent comparison refresh
        if: inputs.refresh_contracts != true
        env:
          CLOUDFLARE_RECOVERY_QUEUES_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_QUEUES_TOKEN }}
          CLOUDFLARE_RECOVERY_KV_READ_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_KV_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HEALTH_URL: https://public-data.org/data/health.json
          BOOTSTRAP_TIMEOUT_MS: "420000"
          FORCE_PUBLICATION_REFRESH: "true"
          FORCE_COMPARISON_REFRESH: "true"
        run: node scripts/bootstrap-cloudflare-publication.mjs

      - name: Bootstrap national, comparison, and contracts evidence
        if: inputs.refresh_contracts == true
        env:
          CLOUDFLARE_RECOVERY_QUEUES_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_QUEUES_TOKEN }}
          CLOUDFLARE_RECOVERY_KV_READ_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_KV_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HEALTH_URL: https://public-data.org/data/health.json
          BOOTSTRAP_TIMEOUT_MS: "660000"
          FORCE_PUBLICATION_REFRESH: "true"
          FORCE_COMPARISON_REFRESH: "true"
          FORCE_CONTRACTS_REFRESH: "true"
        run: node scripts/bootstrap-cloudflare-publication.mjs

  publish_pages:
    if: >-
      always() &&
      needs.release_gate.outputs.current == 'true' &&
      needs.verify_production.result == 'success' &&
      (
        (
          needs.deploy_web_worker.outputs.publications_paused == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.refresh_pages_seed != true) &&
          needs.recover_evidence.result != 'failure' &&
          needs.recover_evidence.result != 'cancelled'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.refresh_pages_seed == true &&
          needs.recover_evidence.result != 'failure' &&
          needs.recover_evidence.result != 'cancelled'
        )
      )
    needs: [release_gate, deploy_web_worker, deploy_data_worker, verify_production, recover_evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: https://public-data-org-git.pages.dev/
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Select the Pages fallback mode
        id: pages_build
        env:
          PAUSED: ${{ needs.deploy_web_worker.outputs.publications_paused }}
        run: |
          set -euo pipefail
          if [[ "$PAUSED" == "true" ]]; then mode=offline; else mode=seed; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Confirm this release is still the current main commit
        id: still_current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_sha" != "$RELEASE_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipped Pages: a newer main commit will publish its own fallback." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the main-only Pages deploy hook
        if: steps.still_current.outputs.current == 'true'
        shell: bash
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          hook_url="${DEPLOY_HOOK_URL:-}"
          unset DEPLOY_HOOK_URL
          if [[ ! "$hook_url" =~ ^https://api\.cloudflare\.com/client/v4/pages/webhooks/deploy_hooks/[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "::error::Set a valid main-only Pages deploy hook URL in the cloudflare-pages environment secret." >&2
            exit 1
          fi
          printf 'url = "%s"\n' "$hook_url" |
            curl --config - --silent --show-error --fail --proto '=https' --tlsv1.2 --max-time 30 \
              --request POST --output /dev/null
          unset hook_url

      - name: Verify the published Pages fallback
        if: steps.still_current.outputs.current == 'true'
        shell: bash
        env:
          PAGES_MODE: ${{ steps.pages_build.outputs.mode }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/pages-release.json"
          url="https://public-data-org-git.pages.dev/"
          if [[ "$PAGES_MODE" == "seed" ]]; then
            url="https://public-data-org-git.pages.dev/data/sections/gdpTracker.json"
          fi

          for attempt in {1..60}; do
            marker_status="$(curl --silent --show-error --output "$marker" --write-out '%{http_code}' --max-time 15 --header 'Cache-Control: no-cache' "https://public-data-org-git.pages.dev/release.json?release=$RELEASE_SHA" || true)"
            if [[ "$marker_status" == "200" ]] && node --input-type=module - "$marker" "$RELEASE_SHA" <<'NODE'
          import { readFileSync } from "node:fs";
          const release = JSON.parse(readFileSync(process.argv[2], "utf8"));
          process.exit(release.commitSha === process.argv[3] && release.branch === "main" ? 0 : 1);
          NODE
            then
              status="$(curl --silent --show-error --output "$RUNNER_TEMP/pages-fallback" --write-out '%{http_code}' --max-time 15 --header 'Cache-Control: no-cache' "$url?release=$RELEASE_SHA" || true)"
              if [[ "$status" == "200" ]] && [[ -s "$RUNNER_TEMP/pages-fallback" ]]; then
                if [[ "$PAGES_MODE" == "seed" ]] || grep -Fq "Data publications are temporarily offline." "$RUNNER_TEMP/pages-fallback"; then
                  exit 0
                fi
              fi
            fi
            sleep 5
          done

          echo "::error::The Pages project did not publish the exact validated main revision and expected $PAGES_MODE fallback." >&2
          exit 1
