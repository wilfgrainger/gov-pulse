name: Deploy public-data.org

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - ".nvmrc"
      - "app/**"
      - "contracts/**"
      - "data/**"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.*"
      - "public/**"
      - "scripts/**"
      - "worker/**"
  workflow_dispatch:
    inputs:
      refresh_evidence:
        description: "Run publication bootstrap recovery (up to ~7 minutes)"
        type: boolean
        default: false
      refresh_pages_seed:
        description: "Rebuild and publish the secondary Pages fallback"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-data-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-internal-worker
      url: https://public-data.org/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install locked OpenNext toolchain
        run: npm ci --prefix worker --prefer-offline --no-audit --no-fund

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      # Main updates arrive through PRs whose required `quality` result has
      # already validated this code. Manual deployments keep the local guard.
      - name: Validate manually dispatched release source
        if: github.event_name == 'workflow_dispatch'
        run: npm run lint && npm run test

      - name: Prepare generated data and assets
        run: npm run build:prepare
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Stage OpenNext adapter config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@opennextjs
          ln -s "$PWD/worker/node_modules/@opennextjs/cloudflare" node_modules/@opennextjs/cloudflare
          cp worker/open-next.config.template open-next.config.ts

      - name: Adapt Next.js build for Cloudflare Workers
        run: >-
          ./worker/node_modules/.bin/opennextjs-cloudflare build
          --config worker/web-wrangler.toml
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Deploy request-time public-data.org web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          ./worker/node_modules/.bin/opennextjs-cloudflare deploy
          --config worker/web-wrangler.toml

      - name: Reconcile Cloudflare Queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUEUE_NAME: public-data-jobs
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler queues info "$QUEUE_NAME" >/dev/null 2>&1; then
            npx wrangler queues create "$QUEUE_NAME" || npx wrangler queues info "$QUEUE_NAME"
          fi

      - name: Deploy Cloudflare data Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm run worker:deploy --
          --tag "$GITHUB_SHA"
          --message "public-data.org Worker $GITHUB_SHA"

      - name: Verify Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler deployments status
          --json
          --config worker/wrangler.toml
          | node scripts/verify-worker-deployment.mjs "$GITHUB_SHA"

      - name: Verify deployed revision and reader routes
        run: npm run test:release -- "https://public-data.org/" "${{ github.sha }}"

      - name: Fetch complete publication for bounded Pages seed fallback
        id: pages-seed-candidate
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_pages_seed
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PUBLICATION_OUTPUT: public/data/metrics-snapshot.json
        run: node scripts/fetch-cloudflare-publication-candidate.mjs

      - name: Build bounded Pages seed fallback
        if: steps.pages-seed-candidate.outcome == 'success'
        run: npm run build:check
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Deploy Pages seed fallback
        if: steps.pages-seed-candidate.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy ./out
          --project-name public-data-org
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "Seed fallback $GITHUB_SHA"

      - name: Verify Pages seed evidence download
        if: steps.pages-seed-candidate.outcome == 'success'
        run: >-
          curl --fail --silent --show-error
          --retry 20 --retry-all-errors --retry-delay 5
          https://public-data-org.pages.dev/data/sections/gdpTracker.json
          --output /dev/null

  recover-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_evidence
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-internal-worker
      url: https://public-data.org/data/health.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Bootstrap fresh evidence and report recovery result
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEALTH_URL: https://public-data.org/data/health.json
          BOOTSTRAP_TIMEOUT_MS: "420000"
          FORCE_PUBLICATION_REFRESH: "true"
        run: node scripts/bootstrap-cloudflare-publication.mjs
