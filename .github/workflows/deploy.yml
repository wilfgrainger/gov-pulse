name: Deploy public-data.org

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - ".nvmrc"
      - "app/**"
      - "contracts/**"
      - "data/**"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.*"
      - "public/**"
      - "scripts/**"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-production
  cancel-in-progress: true

jobs:
  enforce-release-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce main release ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Production deployment is permitted only from refs/heads/main"
            exit 1
          }

  validate-and-build:
    needs: enforce-release-ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify toolchain
        run: npm run toolchain:check

      - name: Lint
        run: npm run lint

      - name: Unit and Worker tests
        run: npm run test

      - name: Build static Pages seed export
        run: npm run build:check
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Install locked OpenNext toolchain
        run: npm ci --prefix worker --prefer-offline --no-fund

      - name: Stage OpenNext adapter config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@opennextjs
          ln -s "$PWD/worker/node_modules/@opennextjs/cloudflare" node_modules/@opennextjs/cloudflare
          cp worker/open-next.config.template open-next.config.ts

      - name: Build request-time Cloudflare web Worker
        run: >-
          ./worker/node_modules/.bin/opennextjs-cloudflare build
          --config worker/web-wrangler.toml
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Verify preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version

      - name: Run deterministic browser tests
        env:
          CI: "true"
          PLAYWRIGHT_PORT: "4173"
        run: npm run test:e2e

  deploy-production:
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-internal-worker
      url: https://public-data.org/
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Install locked OpenNext toolchain
        run: npm ci --prefix worker --prefer-offline --no-fund

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Prepare Next.js server build
        run: npm run build:check
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Stage OpenNext adapter config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@opennextjs
          ln -s "$PWD/worker/node_modules/@opennextjs/cloudflare" node_modules/@opennextjs/cloudflare
          cp worker/open-next.config.template open-next.config.ts

      - name: Adapt Next.js build for Cloudflare Workers
        run: >-
          ./worker/node_modules/.bin/opennextjs-cloudflare build
          --config worker/web-wrangler.toml
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Reconcile Cloudflare Queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUEUE_NAME: public-data-jobs
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler queues info "$QUEUE_NAME" >/dev/null 2>&1; then
            npx wrangler queues create "$QUEUE_NAME" || npx wrangler queues info "$QUEUE_NAME"
          fi
          npx wrangler queues update "$QUEUE_NAME" --message-retention-period-secs 86400

      - name: Deploy Cloudflare data Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm run worker:deploy --
          --tag "$GITHUB_SHA"
          --message "public-data.org Worker $GITHUB_SHA"

      - name: Verify Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler versions list
          --json
          --config worker/wrangler.toml
          | node scripts/verify-worker-deployment.mjs "$GITHUB_SHA"

      - name: Bootstrap and verify Cloudflare publication readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: f950b17f36a447dca7bb339cba8818de
          QUEUE_NAME: public-data-jobs
          HEALTH_URL: https://public-data.org/data/health.json
          BOOTSTRAP_TIMEOUT_MS: "720000"
        run: node scripts/bootstrap-cloudflare-publication.mjs

      - name: Deploy request-time public-data.org web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          ./worker/node_modules/.bin/opennextjs-cloudflare deploy
          --config worker/web-wrangler.toml

      - name: Verify request-time web route is live after data bootstrap
        run: >-
          curl --fail --silent --show-error
          --retry 12 --retry-all-errors --retry-delay 5
          https://public-data.org/section/uk-in-context/
          --output /dev/null

      - name: Verify deployed application, evidence and comparison publication
        run: node scripts/verify-production.mjs "https://public-data.org/" "${{ github.sha }}"

      - name: Verify Cloudflare-published national data
        env:
          METRICS_SNAPSHOT_URL: https://public-data.org/data/metrics-snapshot.json
        run: npm run test:live

      - name: Verify web Worker owns evidence downloads
        run: >-
          curl --fail --silent --show-error
          --retry 20 --retry-all-errors --retry-delay 5
          https://public-data.org/data/sections/gdpTracker.json
          --output /dev/null

      - name: Fetch complete publication for bounded Pages seed fallback
        id: pages-seed-candidate
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PUBLICATION_OUTPUT: public/data/metrics-snapshot.json
        run: node scripts/fetch-cloudflare-publication-candidate.mjs

      - name: Build bounded Pages seed fallback
        if: steps.pages-seed-candidate.outcome == 'success'
        run: npm run build:check
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Deploy Pages seed fallback
        if: steps.pages-seed-candidate.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy ./out
          --project-name public-data-org
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "Seed fallback $GITHUB_SHA"

      - name: Verify Pages seed evidence download
        if: steps.pages-seed-candidate.outcome == 'success'
        run: >-
          curl --fail --silent --show-error
          --retry 20 --retry-all-errors --retry-delay 5
          https://public-data-org.pages.dev/data/sections/gdpTracker.json
          --output /dev/null
