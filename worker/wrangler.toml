name = "pulse-data-worker"
main = "public-data-entry.js"
compatibility_date = "2026-03-17"
# Collectors fetch untrusted publisher URLs; global fetch must only reach the
# public internet, never this account's own zones or Workers.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

# Public data routes are managed in the Cloudflare dashboard. Keeping them out
# of this file avoids granting the deployment token zone-level route access.

# Cache only GET/HEAD responses whose explicit Cache-Control permits it.
# Cache isolation per deploy is essential: publication switches can hold
# evidence immediately on a new version. Never share older cached responses
# after a policy-changing deployment.
[cache]
enabled = true
cross_version_cache = false

[vars]
STATIC_SNAPSHOT_SEED_URL = "https://public-data-org.pages.dev/data/metrics-snapshot.json"

[triggers]
crons = ["17 3 * * *", "47 */3 * * *"]

[[kv_namespaces]]
binding = "METRICS_CACHE"
id = "f950b17f36a447dca7bb339cba8818de"
preview_id = "4c09f1919ccf49169348eab62c48f643"

[[queues.producers]]
binding = "DATA_JOBS"
queue = "public-data-jobs"

[[queues.consumers]]
queue = "public-data-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
retry_delay = 300
