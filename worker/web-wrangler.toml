name = "public-data-web"
main = "web-entry.js"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[assets]
directory = "../.open-next/assets"
binding = "ASSETS"

# Deployment id for the page cache key, so a release never serves another release's pages.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "public-data-web"

[[routes]]
pattern = "public-data.org/*"
zone_name = "public-data.org"
