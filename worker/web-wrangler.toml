name = "public-data-web"
main = "../.open-next/worker.js"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

# The public-data.org route is managed in the Cloudflare dashboard. Keeping it
# out of this file lets the deployment token stay scoped to this Worker only.

[assets]
directory = "../.open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "public-data-web"
